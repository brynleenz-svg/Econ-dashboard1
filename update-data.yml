name: Update data

on:
  schedule:
    # Every day at 04:30 UTC = 5:30pm (NZDT) / 4:30pm (NZST), after RBNZ's 3pm release.
    - cron: "30 4 * * *"
  workflow_dispatch: # lets you press "Run workflow" by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download latest figures
        id: update
        run: python scripts/update.py
        continue-on-error: true # still save whatever did work

      - name: Save changes
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update data $(date -u +%F)"
            git push
          fi

      - name: Fail the run if any figure failed (so GitHub emails you)
        if: steps.update.outcome == 'failure'
        run: |
          echo "One or more figures failed to update. See the 'Download latest figures' step."
          exit 1
